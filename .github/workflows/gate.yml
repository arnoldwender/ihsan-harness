name: gate

# The Ihsan Harness runs its own falsifier on every push. SABR 3 says "refuse
# the cheap rescue"; that rule's falsifier is a claim about a diff, so the repo
# that ships it reads its own diffs with it.
#
# No step interpolates untrusted input into a shell. The one `github.*`
# expression that reaches a `run:` does so through `env:` with the value quoted,
# and it carries a commit SHA rather than a name someone else chose.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push on the same branch cancels the previous run: without this a
  # burst of commits pays for N runs and only the last one matters.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cheap-rescue:
    name: cheap-rescue gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The gate measures a diff, so it needs the history the diff is measured
      # against. A shallow clone would silently reduce the scope to nothing and
      # report clean — the failure mode this whole repo is written against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip pytest

      - name: Self-check (the repo keeps its own promises)
        run: python3 scripts/check.py

      - name: Cheap-rescue gate (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 gate/cheap_rescue.py --base "$BASE_SHA" --sarif cheap-rescue.sarif

      - name: Cheap-rescue gate (push)
        if: github.event_name != 'pull_request'
        run: python3 gate/cheap_rescue.py --base HEAD~1 --sarif cheap-rescue.sarif

      - name: Citation gate (every quotation traces to sources/)
        # Runs on every event, unlike the cheap-rescue gate above. That one reads
        # a diff and has nothing to say when there is none; this one reads the
        # whole tree, so its verdict means the same thing however it was invoked.
        # PyYAML is deliberately NOT installed, and there is no fallback to keep
        # from rotting: the gate parses sources/*.yml with a parser it ships
        # itself, in every environment. It used to prefer PyYAML when installed,
        # which meant six of the ten editions checked their sources against a
        # parser that accepts more than the four remaining ones do — same gate,
        # same file, different answer. That branch is gone.
        run: python3 gate/citations.py --sarif citations.sarif

      - name: Citation gate, online (manual runs only)
        # Link rot is worth knowing about and is never a reason to block a commit
        # that did not touch the link.
        if: github.event_name == 'workflow_dispatch'
        run: python3 gate/citations.py --online

      - name: Mutation check for the citation gate (do its tests defend it?)
        # Separate from the repo's own mutation runner above: two gates, two
        # runners, so a stale anchor in one cannot quietly disable the other.
        run: python3 tests/mutation_check_citations.py

      - name: Mutation check (do the tests defend the gate?)
        run: python3 tests/mutation_check.py

      - name: Tests
        run: python3 -m pytest tests/ -q

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cheap-rescue-sarif
          path: cheap-rescue.sarif
          if-no-files-found: ignore

      - name: Upload citation SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: citations-sarif
          path: citations.sarif
          if-no-files-found: ignore
