# The Bani Adam lines, Gulistan chapter I, story 10. Verified 2026-09-10 against
# the full text of Rehatsek's translation on Internet Archive, matched with
# punctuation ignored, because Rehatsek sets it as four lines of verse:
#
#   The sons of Adam are limbs of each other
#   Having been created of one essence.
#   When the calamity of time afflicts one limb
#   The other limbs cannot remain at rest.
#
# The repo prints it as one prose sentence. Every word is Rehatsek's and in his
# order; the comma and the semicolon that join the lines are the repo's, and
# that is the only difference.
